  /aivision/jobs/{job_id}/cancel:
    post:
      summary: Cancel a job
      description: |
        Cancel a job and all its associated tasks.

        **Important Notes:**
        - Any job can be canceled regardless of its current status (`pending`, `processing`, or `completed`)
        - Jobs that are already `canceled` cannot be canceled again
        - When a job is canceled, **all associated tasks will be updated to `canceled` status**, including tasks that were already completed
        - The job status will be updated to `canceled`
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: The unique ID of the job to cancel
          schema:
            type: string
            format: uuid
            example: "4110b319-12f1-426f-8844-483509cde46d"
      responses:
        "200":
          description: Job canceled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Job canceled successfully
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      job_id: "4110b319-12f1-426f-8844-483509cde46d"
                      status: "canceled"
                      canceled_tasks: 3
        "400":
          description: Cannot cancel job - job is already canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                already_canceled:
                  summary: Job already canceled
                  value:
                    status_code: 400
                    message: "Cannot cancel job: job is already canceled"
                    result: null
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                invalid_token:
                  summary: Invalid token
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  summary: Job not found
