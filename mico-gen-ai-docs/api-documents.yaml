                        [
                          "https://s3.amazonaws.com/bucket/auto-background-removal/processed-12345.png",
                        ]
        "400":
          description: Bad request - missing or invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_file:
                  summary: Missing file error
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
                invalid_file:
                  summary: Invalid file type error
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
        "401":
