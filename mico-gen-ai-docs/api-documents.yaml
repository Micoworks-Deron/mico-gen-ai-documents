  /aivision/adVariation:
    post:
      summary: Ad Variation (Manual/Auto Mode)
      operationId: ad-variation
      description: |
        Generate ad variation with manual prompt or auto analysis mode.
        This is an asynchronous operation that returns a job_id. Use the `/aivision/jobs/:job_id` endpoint to check the status and retrieve results.
        When batchSize is provided, creates multiple tasks per image (e.g., batchSize=2 creates 2 tasks with the same job_id but different task_ids).

        **Modes:**
        - `manual`: Provide a custom prompt to guide the ad variation generation
        - `auto`: Automatically analyze the image and generate variations

        **Supported Models:**
        - Gemini (default)
        - Flux
        - Other available models
      tags:
        - AI Vision
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - mode
                - image
              properties:
                mode:
                  type: string
                  enum: [manual, auto]
                  description: Generation mode - 'manual' for custom prompt or 'auto' for automatic analysis
                  example: "manual"
                prompt:
                  type: string
                  description: Custom prompt for manual mode (optional for auto mode)
                  example: "Create a summer sale variation with bright colors"
                image:
                  type: string
                  format: binary
                  description: Main image file to create variation from (JPEG, PNG, WebP, max 35MB)
                ref_image:
                  type: string
                  format: binary
                  description: Optional reference image for style guidance
                model:
                  type: string
                  description: AI model to use (optional, defaults to Gemini)
                  example: "gemini"
                metadata:
                  type: string
                  description: Additional metadata for the request (optional, JSON string)
                batchSize:
                  type: integer
                  description: Number of tasks to create per image (optional, defaults to 1). When batchSize > 1, multiple tasks are created with the same job_id but different task_ids and sequential indices.
                  minimum: 1
                  maximum: 6
                  default: 1
                  example: 2
            examples:
              manual_mode:
                summary: Manual mode with custom prompt
                description: Generate ad variation using a custom prompt
                value:
                  mode: "manual"
                  prompt: "Create a holiday themed variation"
                  image: "ad_image.jpg"
                  model: "gemini"
              auto_mode:
                summary: Auto mode with automatic analysis
                description: Automatically analyze and generate ad variation
                value:
                  mode: "auto"
                  image: "ad_image.jpg"
              with_reference:
                summary: Manual mode with reference image
                description: Generate variation using a reference image for style
                value:
                  mode: "manual"
                  prompt: "Match the style of the reference image"
                  image: "ad_image.jpg"
                  ref_image: "reference_style.jpg"
              batch_processing:
                summary: Batch processing
                description: Create multiple tasks (batchSize=3) for the same image
                value:
                  mode: "auto"
                  image: "ad_image.jpg"
                  batchSize: 3
      responses:
        "200":
          description: Ad variation job queued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Successful job creation
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      job_id: "4110b319-12f1-426f-8844-483509cde46d"
                      status: "processing"
        "400":
          description: Bad request - missing required input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_image:
                  summary: Missing image
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
                missing_mode:
                  summary: Missing mode
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Internal server error
