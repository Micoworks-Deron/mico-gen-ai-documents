paths:
  /aivision/adVariation:
    post:
      summary: Ad Variation Generation
      description: |
        Generate ad variations with manual prompts or automatic analysis mode. Supports multiple models including Gemini, Flux, and other AI services.
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - mode
                - image
              properties:
                mode:
                  type: string
                  enum: [manual, auto]
                  description: Generation mode - manual for custom prompts, auto for AI analysis
                  example: "manual"
                prompt:
                  type: string
                  description: Text prompt for manual mode (required when mode=manual)
                  example: "Create a modern, minimalist ad variation"
                image:
                  type: string
                  format: binary
                  description: Input image file
                ref_image:
                  type: string
                  format: binary
                  description: Reference image for style guidance (optional)
                model:
                  type: string
                  description: AI model to use (gemini, flux, etc.)
                  example: "gemini"
                metadata:
                  type: string
                  description: Additional metadata for the request
      responses:
        "200":
          description: Ad variation generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Successful ad variation generation
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      image_url: "https://example.com/generated-ad-variation.jpg"
                      metadata:
                        model_used: "gemini"
                        mode: "manual"
                        processing_time: "2.5s"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bad_request:
                  summary: Invalid request parameters
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
                    error: "Missing required field: mode"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                    error: "Authorization header is required"
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                    error: "Invalid or expired Bearer token"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    status_code: 500
                    message: "INTERNAL_SERVER_ERROR"
                    result: null

  /aivision/autoBackgroundRemoval:
    post:
      summary: Auto background removal
      description: |
        Automatically remove the background from an uploaded image using AI.
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to process (JPEG, PNG, WebP, max 35MB)
              required:
                - file
            examples:
              basic:
                summary: Basic background removal
                description: Upload an image to remove its background
                value:
                  file: "portrait.jpg"
              product:
                summary: Product image background removal
                description: Remove background from a product photo
                value:
                  file: "product.png"
      responses:
        "200":
          description: Background removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
