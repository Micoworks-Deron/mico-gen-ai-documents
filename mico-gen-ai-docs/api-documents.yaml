components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication. Supports two formats:
        1. Bearer with API key: `Authorization: Bearer YOUR_API_KEY`

  schemas:
    SuccessResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: HTTP status code
          example: 200
        message:
          type: string
          description: Response message
          example: "SUCCESS"
        result:
          oneOf:
            - type: object
              properties:
                success:
                  type: boolean
                  description: Operation success status
                  example: true
                message:
                  type: string
                  description: Operation message
                  example: "Background removed successfully"
                data:
                  type: array
                  items:
                    type: string
                  description: Array of result URLs
                  example:
                    [
                      "https://s3.amazonaws.com/bucket/processed/image-12345.png",
                    ]
            - type: array
              items:
                type: string
              description: Array of result URLs
              example:
                [
                  "https://s3.amazonaws.com/bucket/generated/image-1.png",
                  "https://s3.amazonaws.com/bucket/generated/image-2.png",
                ]
      required:
        - status_code
        - message
        - result

    PromptData:
      type: object
      description: |
        JSON prompt object that allows for detailed control over image generation.
        The 'text' property is optional and can be empty, while all other properties are optional and will be
        automatically combined into the final prompt.
      properties:
        text:
          type: string
          description: Main text description for the image generation (optional)
          example: "A young Japanese female in the building on a sunny day"
          minLength: 0
        category:
          type: string
          description: Image category (e.g., illustration, photography, art)
          example: "illustration"
        style:
          type: string
          description: Visual style of the image
          example: "Japanese Manga pop style"
        background:
          type: string
          description: Background description
          example: "urban cityscape"
        mood:
          type: string
          description: Mood or atmosphere of the image
          example: "peaceful"
        lighting:
          type: string
          description: Lighting conditions
          example: "soft natural light"
        composition:
          type: string
          description: Composition style
          example: "close-up portrait"
      additionalProperties: true
      example:
        text: ""
        category: "illustration"
        style: "Japanese Manga pop style"
        background: "urban cityscape"
        mood: "peaceful"

    ErrorResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: "BAD_REQUEST"
        result:
          type: null
          description: Null result for errors
      required:
        - status_code
        - message
        - result

    HumanGenerationRequest:
      type: object
      properties:
        prompt:
          oneOf:
            - type: string
              description: Text prompt describing the human to generate
              example: "A beautiful woman in a garden"
              minLength: 1
            - $ref: "#/components/schemas/PromptData"
          description: |
            Prompt for human generation. Can be a simple string or a JSON object with additional properties.
            The JSON format allows for more detailed control over the generation process.
        width:
          type: integer
          description: Image width in pixels
          minimum: 64
          maximum: 2048
          default: 1024
          example: 1024
        height:
          type: integer
          description: Image height in pixels
          minimum: 64
          maximum: 2048
          default: 768
          example: 768
        batchSize:
          type: integer
          description: Number of images to generate
          minimum: 1
          maximum: 10
          default: 3
          example: 3
        accelerator:
          type: string
          enum: [low, medium, high]
          description: GPU accelerator level
          default: medium
          example: medium
      required:
        - prompt

    StockPhotoGenerationRequest:
      type: object
      properties:
        prompt:
          oneOf:
            - type: string
              description: Text prompt describing the stock photo to generate
              example: "A modern office workspace"
              minLength: 1
            - $ref: "#/components/schemas/PromptData"
          description: |
            Prompt for stock photo generation. Can be a simple string or a JSON object with additional properties.
            The JSON format allows for more detailed control over the generation process.
        width:
          type: integer
          description: Image width in pixels
          minimum: 64
          maximum: 2048
          default: 1024
          example: 1024
        height:
          type: integer
          description: Image height in pixels
          minimum: 64
          maximum: 2048
          default: 1024
          example: 1024
        batchSize:
          type: integer
          description: Number of images to generate
          minimum: 1
          maximum: 10
          default: 3
          example: 3
        accelerator:
          type: string
          enum: [low, medium, high]
          description: GPU accelerator level
          default: medium
          example: medium
        promptEnhancer:
          type: boolean
          description: If true, enhances the prompt with OpenAI after translation
          default: false
          example: false
      required:
        - prompt

    BoundingBox:
      type: object
      properties:
        startX:
          type: integer
          description: Starting X coordinate
          minimum: 0
          example: 100
        startY:
          type: integer
          description: Starting Y coordinate
          minimum: 0
          example: 150
        endX:
          type: integer
          description: Ending X coordinate
          minimum: 0
          example: 300
        endY:
          type: integer
          description: Ending Y coordinate
          minimum: 0
          example: 400
      required:
        - startX
        - startY
        - endX
        - endY

    Point:
      type: object
      properties:
        x:
          type: integer
          description: X coordinate
          example: 150
        y:
          type: integer
          description: Y coordinate
          example: 200
      required:
        - x
        - y

    OutpaintingOptions:
      type: object
      properties:
        left:
          type: integer
          description: Pixels to extend on the left
          default: 128
          example: 128
        top:
          type: integer
          description: Pixels to extend on the top
          default: 128
