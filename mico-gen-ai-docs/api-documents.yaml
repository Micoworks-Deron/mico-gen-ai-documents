  /aivision/imageToVideo:
    post:
      summary: Image to Video
      description: |
        Convert an uploaded image to a video using ComfyUI workflow.

        ### Temporary TLS workaround (Staging/Production)
        If you see `ERR_CERT_COMMON_NAME_INVALID` on **Staging** / **Production**, it's a temporary certificate hostname mismatch.

        - **curl**: add `--insecure` (or `-k`)
        - **Postman**: disable SSL certificate verification
        - **Browser calls**: generally cannot bypass TLS verification; wait for the certificate fix

        ### Example (Development)
        ```bash
        curl --location 'https://api-mico-gen-ai.dev-craft.mico.one/aivision/imageToVideo' \
          --header 'Authorization: Bearer YOUR_API_KEY' \
          --form 'imageFile=@/path/to/image.jpg' \
          --form-string 'prompt=Describe the motion you want in the video' \
          --form 'videoLength=3'
        ```

        ### Example (Staging)
        ```bash
        curl -k --location 'https://mico.gen.ai.stg-craft.mico.one/aivision/imageToVideo' \
          --header 'Authorization: Bearer YOUR_API_KEY' \
          --form 'imageFile=@/path/to/image.jpg' \
          --form-string 'prompt=Describe the motion you want in the video' \
          --form 'videoLength=3'
        ```
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imageFile
                - prompt
              properties:
                imageFile:
                  type: string
                  format: binary
                  description: Input image file to animate
                prompt:
                  type: string
                  description: Text prompt describing the video generation
                  example: "A cinematic shot of a car moving forward"
                  minLength: 1
                videoLength:
                  type: integer
                  description: Desired video length in frames (optional)
                  example: 16
      responses:
        "200":
          description: Video generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Successful video generation
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      videoUrl: "https://s3.amazonaws.com/bucket/image-to-video/generated-video.mp4"
                      processingTime: 15600
        "400":
          description: Bad request - missing image file or prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_file:
                  summary: Missing file
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
                    error: "Image file is required"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                    error: "Authorization header is required"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
