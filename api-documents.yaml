openapi: 3.0.3
info:
  title: Mico Gen AI
  description: |
    Comprehensive AI Vision API for image processing and generation platforms.

    ## Features
    - **Template Variation**: Optimize and generate variations of design templates
    - **Background Removal**: Automatically remove backgrounds from images
    - **Human Generation**: Generate photorealistic human images from text prompts with detailed control options
    - **Stock Photo Generation**: Generate stock photo style images with enhanced prompts and detailed control options
    - **Inpainting Removal**: Remove objects from images using AI inpainting
    - **Image to Video**: Convert an uploaded image to a video
    - **Job Status Tracking**: Monitor the progress and retrieve results for asynchronous AI vision tasks
    - **Job Cancellation**: Cancel a job in progress

    ## Authentication
    All `/aivision/*` endpoints require authentication using one of the following methods:

    Use your API key with Bearer format:
    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    ## File Upload Limits
    - Maximum file size: 35MB
    - Supported formats: JPEG, PNG, WebP
    - Maximum files per request: 6

    ## Services
    - **Gemini3.0**: Primary AI service for most operations
    - **OpenAI**: Alternative service for most operations
    - **Mico**: Alternative service for most operations

    ## Prompt Formats
    The API supports two prompt formats for generation endpoints:

    ### String Format (Simple)
    ```json
    {
      "prompt": "A beautiful woman in a garden"
    }
    ```

    ### JSON Format (Advanced)
    ```json
    {
      "prompt": {
        "text": "A beautiful woman in a garden",
        "category": "illustration",
        "style": "realistic photography",
        "background": "natural garden setting",
        "mood": "peaceful"
      }
    }
    ```

    The JSON format allows for detailed control over image generation by combining multiple properties into a single, well-formatted prompt. The `text` property is optional and can be empty, allowing for metadata-only prompts.
  version: 1.0.0
  contact:
    name: Mico GenAI services API Support
    email: l.deron@mico-inc.com
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC

servers:
  - url: https://api-mico-gen-ai.dev-craft.mico.one
    description: Development server (dev)
  - url: https://mico.gen.ai.stg-craft.mico.one
    description: "Staging server (stg). Note: TLS certificate for this hostname is being updated; use curl --insecure (-k) or disable SSL verification in Postman temporarily."
  - url: https://mico.gen.ai.craft.mico.one
    description: "Production server (prd). Note: TLS certificate for this hostname is being updated; use curl --insecure (-k) or disable SSL verification in Postman temporarily."

tags:
  - name: Mico Gen AI
    description: AI-powered image processing and generation endpoints
  - name: Authentication
    description: Authentication and token management endpoints

paths:
  /aivision/autoBackgroundRemoval:
    post:
      summary: Auto background removal
      description: |
        Automatically remove the background from an uploaded image using AI.
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to process (JPEG, PNG, WebP, max 35MB)
              required:
                - file
            examples:
              basic:
                summary: Basic background removal
                description: Upload an image to remove its background
                value:
                  file: "portrait.jpg"
              product:
                summary: Product image background removal
                description: Remove background from a product photo
                value:
                  file: "product.png"
      responses:
        "200":
          description: Background removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Successful background removal
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      job_id: "4110b319-12f1-426f-8844-483509cde46d"
                      status: "processing"
        "400":
          description: Bad request - missing or invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_file:
                  summary: Missing file error
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
                invalid_file:
                  summary: Invalid file type error
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                invalid_token:
                  summary: Invalid token
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    status_code: 500
                    message: "INTERNAL_SERVER_ERROR"
                    result: null

