  /aivision/jobs/{job_id}/cancel:
    post:
      summary: Cancel a job
      description: |
        Cancel a job and all its associated tasks.

        **Important Notes:**
        - Any job can be canceled regardless of its current status (`pending`, `processing`, or `completed`)
        - Jobs that are already `canceled` cannot be canceled again
        - When a job is canceled, **all associated tasks will be updated to `canceled` status**, including tasks that were already completed
        - The job status will be updated to `canceled`
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: The unique ID of the job to cancel
          schema:
            type: string
            format: uuid
            example: "4110b319-12f1-426f-8844-483509cde46d"
      responses:
        "200":
          description: Job canceled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Job canceled successfully
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      job_id: "4110b319-12f1-426f-8844-483509cde46d"
                      status: "canceled"
                      canceled_tasks: 3
        "400":
          description: Cannot cancel job - job is already canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                already_canceled:
                  summary: Job already canceled
                  value:
                    status_code: 400
                    message: "Cannot cancel job: job is already canceled"
                    result: null
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                invalid_token:
                  summary: Invalid token
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  summary: Job not found
                  value:
                    status_code: 404
                    message: "Job not found"
                    result: null
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    status_code: 500
                    message: "INTERNAL_SERVER_ERROR"
                    result: null

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication. Supports two formats:
        1. Bearer with API key: `Authorization: Bearer YOUR_API_KEY`

  schemas:
    SuccessResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: HTTP status code
          example: 200
        message:
          type: string
          description: Response message
          example: "SUCCESS"
        result:
          description: Detailed response data
      required:
        - status_code
        - message
        - result

    PromptData:
      type: object
      description: |
        JSON prompt object that allows for detailed control over image generation.
        The 'text' property is optional and can be empty, while all other properties are optional and will be
        automatically combined into the final prompt.
      properties:
        text:
          type: string
          description: Main text description for the image generation (optional)
          example: "A young Japanese female in the building on a sunny day"
          minLength: 0
        category:
          type: string
          description: Image category (e.g., illustration, photography, art)
          example: "illustration"
        style:
          type: string
          description: Visual style of the image
          example: "Japanese Manga pop style"
        background:
          type: string
          description: Background description
          example: "urban cityscape"
        mood:
          type: string
          description: Mood or atmosphere of the image
          example: "peaceful"
        lighting:
          type: string
          description: Lighting conditions
          example: "soft natural light"
        composition:
          type: string
          description: Composition style
          example: "close-up portrait"
      additionalProperties: true
      example:
        text: ""
        category: "illustration"
        style: "Japanese Manga pop style"
        background: "urban cityscape"
        mood: "peaceful"

    ErrorResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: "BAD_REQUEST"
        result:
          type: null
          description: Null result for errors
      required:
        - status_code
        - message
        - result

    HumanGenerationRequest:
      type: object
      properties:
        prompt:
          oneOf:
            - type: string
              description: Text prompt describing the human to generate
              example: "A beautiful woman in a garden"
              minLength: 1
            - $ref: "#/components/schemas/PromptData"
          description: |
            Prompt for human generation. Can be a simple string or a JSON object with additional properties.
            The JSON format allows for more detailed control over the generation process.
        width:
          type: integer
          description: Image width in pixels
          minimum: 64
          maximum: 2048
          default: 1024
          example: 1024
        height:
          type: integer
          description: Image height in pixels
          minimum: 64
          maximum: 2048
          default: 768
          example: 768
        batchSize:
          type: integer
          description: Number of images to generate
          minimum: 1
          maximum: 10
          default: 3
          example: 3
        model:
          type: string
          enum: [gemini, openai]
          description: AI model to use
          default: gemini
          example: gemini
      required:
        - prompt

    StockPhotoGenerationRequest:
      type: object
      properties:
        prompt:
          oneOf:
            - type: string
              description: Text prompt describing the stock photo to generate
              example: "A modern office workspace"
              minLength: 1
            - $ref: "#/components/schemas/PromptData"
          description: |
            Prompt for stock photo generation. Can be a simple string or a JSON object with additional properties.
            The JSON format allows for more detailed control over the generation process.
        width:
          type: integer
          description: Image width in pixels
          minimum: 64
          maximum: 2048
          default: 1024
          example: 1024
        height:
          type: integer
          description: Image height in pixels
          minimum: 64
          maximum: 2048
          default: 1024
          example: 1024
        batchSize:
          type: integer
          description: Number of images to generate
          minimum: 1
          maximum: 10
          default: 3
          example: 3
        model:
          type: string
          enum: [gemini, openai]
          description: AI model to use
          default: gemini
          example: gemini
        promptEnhancer:
          type: boolean
          description: If true, enhances the prompt with OpenAI after translation
          default: false
          example: false
      required:
        - prompt

    BoundingBox:
      type: object
      properties:
        startX:
          type: integer
          description: Starting X coordinate
          minimum: 0
          example: 100
        startY:
          type: integer
          description: Starting Y coordinate
          minimum: 0
          example: 150
        endX:
          type: integer
          description: Ending X coordinate
          minimum: 0
          example: 300
        endY:
          type: integer
          description: Ending Y coordinate
          minimum: 0
          example: 400
      required:
        - startX
        - startY
        - endX
        - endY

    Point:
      type: object
      properties:
        x:
          type: integer
          description: X coordinate
          example: 150
        y:
          type: integer
          description: Y coordinate
          example: 200
      required:
        - x
        - y

    OutpaintingOptions:
      type: object
      properties:
        left:
          type: integer
          description: Pixels to extend on the left
          default: 128
          example: 128
        top:
          type: integer
          description: Pixels to extend on the top
          default: 128
          example: 128
        right:
          type: integer
          description: Pixels to extend on the right
          default: 128
          example: 128
        bottom:
          type: integer
          description: Pixels to extend on the bottom
          default: 128
          example: 128

security:
  - BearerAuth: []