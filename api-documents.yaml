  /aivision/imageInpaintingRemoval:
    post:
      summary: Remove objects using inpainting
      description: |
        Remove objects from an image using AI inpainting techniques.
        Supports Mico (ComfyICU), Flux, and OpenAI services.
        For Flux and OpenAI services, only the original image and prompt are required.
        For Mico service, both original image and mask are required.
      tags:
        - AI Vision
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Original image file (JPEG, PNG, WebP, max 35MB)
                maskFile:
                  type: string
                  format: binary
                  description: Mask file indicating areas to remove (required for Mico service)
                prompt:
                  type: string
                  description: Text prompt describing what to remove (required for Flux/OpenAI services)
                service:
                  type: string
                  enum: [mico, flux, openai]
                  description: Processing service to use
                  default: mico
            examples:
              mico_service:
                summary: Using Mico service
                description: Remove object using Mico service with mask
                value:
                  file: "photo_with_person.jpg"
                  maskFile: "person_mask.png"
                  prompt: "Remove the specified area and fill with realistic details"
                  service: "mico"
              flux_service:
                summary: Using Flux service
                description: Remove object using Flux service with prompt
                value:
                  file: "crowded_street.jpg"
                  prompt: "Remove the person from the background"
                  service: "flux"
              openai_service:
                summary: Using OpenAI service
                description: Remove object using OpenAI service with prompt
                value:
                  file: "group_photo.jpg"
                  prompt: "Remove the unwanted person from the photo"
                  service: "openai"
              remove_multiple:
                summary: Remove multiple objects
                description: Remove several objects from the image
                value:
                  file: "group_photo.jpg"
                  maskFile: "unwanted_objects_mask.png"
                  prompt: "Remove all marked objects and fill naturally"
                  service: "mico"
      responses:
        "200":
          description: Object removal completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Successful object removal
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      job_id: "4110b319-12f1-426f-8844-483509cde46d"
                      status: "processing"
        "400":
          description: Bad request - missing files or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_files:
                  summary: Missing required files
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                invalid_token:
                  summary: Invalid token
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null

  /aivision/imageToVideo:
    post:
      summary: Image to Video
      description: |
        Convert an uploaded image to a video using ComfyUI workflow.

        ### Example (Development)
        ```bash
        curl --location 'https://api-mico-gen-ai.dev-craft.mico.one/aivision/imageToVideo' \
          --header 'Authorization: Bearer YOUR_API_KEY' \
          --form 'imageFile=@/path/to/image.jpg' \
          --form-string 'prompt=Describe the motion you want in the video' \
          --form 'videoLength=3'
        ```

        ### Example (Staging)
        ```bash
        curl -k --location 'https://mico.gen.ai.stg-craft.mico.one/aivision/imageToVideo' \
          --header 'Authorization: Bearer YOUR_API_KEY' \
          --form 'imageFile=@/path/to/image.jpg' \
          --form-string 'prompt=Describe the motion you want in the video' \
          --form 'videoLength=3'
        ```
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imageFile
                - prompt
              properties:
                imageFile:
                  type: string
                  format: binary
                  description: Input image file to animate
                prompt:
                  type: string
                  description: Text prompt describing the video generation
                  example: "A cinematic shot of a car moving forward"
                  minLength: 1
                videoLength:
                  type: integer
                  description: Desired video length in frames (optional)
                  example: 16
      responses:
        "200":
          description: Video generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Successful video generation
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      videoUrl: "https://s3.amazonaws.com/bucket/image-to-video/generated-video.mp4"
                      processingTime: 15600
        "400":
          description: Bad request - missing image file or prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_file:
                  summary: Missing file
                  value:
                    status_code: 400
                    message: "BAD_REQUEST"
                    result: null
                    error: "Image file is required"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                    error: "Authorization header is required"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    status_code: 500
                    message: "INTERNAL_SERVER_ERROR"
                    result: null

  /mcr/templateVariation:
    post:
      summary: Template variation optimization
      operationId: template-variation-mcr
      description: |
        Accepts template image as file upload and template data as JSON string in multipart form.
        When batchSize is provided, creates multiple tasks per image (e.g., batchSize=2 creates 2 tasks with the same job_id but different task_ids).
        
        This is an asynchronous operation that returns a job_id. Use the `/aivision/jobs/:job_id` endpoint to check the status and retrieve results.
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - templateImage
                - templateData
              properties:
                templateImage:
                  type: string
                  format: binary
                  description: Template image file to process (JPEG, PNG, WebP, max 35MB)
                templateData:
                  type: string
                  description: |
                    Template JSON data structure as a string. Contains template configuration including layers, text elements, and styling information.
                    Example: '{"sheet_id": 2944, "sheet_name": "MicoCraft", "height": 1024, "width": 779, "layers": [...]}'
                prompt:
                  type: string
                  description: User requirements for template optimization (optional, defaults to "do a variation as a pro designer")
                  example: "Create a modern, minimalist design variation"
                metadata:
                  type: string
                  description: Additional metadata for the request (optional)
                generateImage:
                  type: string
                  description: Whether to generate the final image (optional, defaults to "true"). Set to "false" to skip image generation.
                  enum: ["true", "false"]
                  default: "true"
                batchSize:
                  type: integer
                  description: Number of tasks to create per image (optional, defaults to 1). When batchSize > 1, multiple tasks are created with the same job_id but different task_ids and sequential indices.
                  minimum: 1
                  maximum: 10
                  default: 1
                  example: 2
            examples:
              basic:
                summary: Basic template variation
                description: Generate a single variation with default settings
                value:
                  templateImage: "template.jpg"
                  templateData: '{"sheet_id": 2944, "sheet_name": "MicoCraft", "height": 1024, "width": 779, "layers": []}'
              batch_processing:
                summary: Batch processing
                description: Create multiple tasks (batchSize=3) for the same image
                value:
                  templateImage: "template.jpg"
                  templateData: '{"sheet_id": 2944, "layers": []}'
                  batchSize: "3"
      responses:
        "200":
          description: MCR Template variation job created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Successful job creation
                  value:
                    status_code: 200
                    message: "SUCCESS"
                    result:
                      job_id: "4110b319-12f1-426f-8844-483509cde46d"
                      status: "processing"
        "400":
          description: Bad request - missing required parameters (templateImage file or templateData)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_file:
                  summary: Missing templateImage file
                  value:
                    status_code: 400
                    message: "BAD_REQUEST: templateImage is required"
                    result: null
                missing_data:
                  summary: Missing templateData
                  value:
                    status_code: 400
                    message: "BAD_REQUEST: templateData is required"
                    result: null
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_auth:
                  summary: Missing authorization header
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
                invalid_token:
                  summary: Invalid token
                  value:
                    status_code: 401
                    message: "UNAUTHORIZED"
                    result: null
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Internal server error
                  value:
                    status_code: 500
                    message: "INTERNAL_SERVER_ERROR"
                    result: null

  /aivision/jobs/{job_id}:
    get:
      summary: Get job status
      description: |
        Fetch the status and results of an asynchronous AI vision job.
        Returns detailed information about the job including all associated tasks, their statuses, results, and processing times.
        
        This endpoint is used to check the status of jobs created by asynchronous operations such as:
        - `/mcr/templateVariation` - MCR template variation jobs
        - `/aivision/autoBackgroundRemoval` - Background removal jobs
        - `/aivision/humanGeneration` - Human generation jobs
        - `/aivision/stockPhotoGeneration` - Stock photo generation jobs
        - `/aivision/imageInpaintingRemoval` - Inpainting removal jobs
        
        The response includes:
        - Job-level information (job_id, status, job_type, batch_size)
        - Task-level information (task_id, index, status, result URL or JSON string, processingTime, error_msg)
        - Job-Status category (completed, failed, pending, processing, canceled)
        - Progress tracking (total_tasks, completed_tasks, failed_tasks, canceled_tasks)
        
        Note: For `TEMPLATE_VARIATION` jobs, the `result` field in the tasks array contains a stringified JSON of the optimized template instead of a URL.
      tags:
        - Mico Gen AI
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: The unique ID of the job
          schema:
            type: string
            format: uuid
            example: "4110b319-12f1-426f-8844-483509cde46d"
      responses:
        "200":
          description: Job status successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                processing:
                  summary: Job still processing
